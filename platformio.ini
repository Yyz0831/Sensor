; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Core/Src
include_dir = Core/Inc
default_envs = wind_tunnel_adc

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
board_build.f_cpu = 84000000L
upload_protocol = stlink
monitor_speed = 115200
build_flags = -Wl,-u,_printf_float
build_src_filter = +<*> -<mini_scales_main.c> -<mini_scales.c> -<weight_*.c>

[env:mini_scales]
extends = env:nucleo_f411re
build_src_filter =
    +<*>
    -<main.c>
    -<adc.c>
    -<temperature_sensors.c>
    -<temperature_conversion.c>
    -<weight_*.c>

[env:weight_i2c]
extends = env:nucleo_f411re
build_src_filter =
    +<*>
    -<main.c>
    -<adc.c>
    -<temperature_sensors.c>
    -<temperature_conversion.c>
    -<mini_scales.c>
    -<mini_scales_main.c>
    -<weight_wind_tunnel_main.c>
    -<weight_adc_stream.c>
    -<weight_wind_speed.c>
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF

; Course Logger: single raw ADC integer per line, 200 Hz UART output.
[env:wind_tunnel_adc]
extends = env:nucleo_f411re
build_flags =
    ${env:nucleo_f411re.build_flags}
    -DWEIGHT_WIND_TUNNEL_ADC
build_src_filter =
    +<*>
    -<main.c>
    -<adc.c>
    -<temperature_sensors.c>
    -<temperature_conversion.c>
    -<mini_scales.c>
    -<mini_scales_main.c>
    -<weight_i2c_main.c>
    -<weight_calibration.c>
    -<weight_command.c>
    -<weight_wind_speed.c>
monitor_echo = no

; Calibrated m/s for the same plate; boot/reset auto-zeros with fan OFF (~4 s).
[env:wind_tunnel_speed]
extends = env:nucleo_f411re
build_flags =
    ${env:nucleo_f411re.build_flags}
    -DWEIGHT_WIND_TUNNEL_SPEED
build_src_filter =
    +<*>
    -<main.c>
    -<adc.c>
    -<temperature_sensors.c>
    -<temperature_conversion.c>
    -<mini_scales.c>
    -<mini_scales_main.c>
    -<weight_i2c_main.c>
    -<weight_calibration.c>
    -<weight_command.c>
    -<weight_adc_stream.c>
monitor_echo = no

; Independently selectable/uploadable old five-run calibration parameters.
; Shares the speed algorithm (200 Hz EMA, tau=0.2 s, reset tare ~4 s).
[env:wind_tunnel_speed_backup]
extends = env:wind_tunnel_speed
build_flags =
    ${env:wind_tunnel_speed.build_flags}
    -DWEIGHT_WIND_SPEED_BACKUP_PROFILE
